<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
    <linearGradient id="sareeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#9D174D" />
    </linearGradient>
    <linearGradient id="skinGradFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3C5A5" />
      <stop offset="100%" stop-color="#E2AE8A" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGradFem)" stroke="#DB2777" stroke-width="4" />

  <!-- Saree / Blouse -->
  <path d="M42 185 C42 148, 70 138, 100 138 C130 138, 158 148, 158 185 Z" fill="url(#sareeGrad)" />
  <!-- Pallu Drape -->
  <path d="M60 185 C60 148, 85 142, 135 185 Z" fill="#F472B6" opacity="0.9" />
  <path d="M60 185 L135 185" stroke="#FBBF24" stroke-width="3" />
  <circle cx="100" cy="155" r="4" fill="#FBBF24" stroke="#B45309" stroke-width="1" />

  <!-- Neck -->
  <rect x="89" y="115" width="22" height="26" rx="6" fill="url(#skinGradFem)" />
  <!-- Necklace / Mangalsutra -->
  <path d="M86 132 C95 142, 105 142, 114 132" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="100" cy="139" r="3" fill="#DC2626" />

  <!-- Long Hair (Back) -->
  <path d="M52 85 C45 130, 52 170, 68 185 L52 185 C40 160, 36 120, 48 85 Z" fill="url(#hairGrad)" />
  <path d="M148 85 C155 130, 148 170, 132 185 L148 185 C160 160, 164 120, 152 85 Z" fill="url(#hairGrad)" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="94" rx="32" ry="38" fill="url(#skinGradFem)" />

  <!-- Ears & Jhumkas -->
  <ellipse cx="66" cy="96" rx="6" ry="9" fill="#E2AE8A" />
  <ellipse cx="134" cy="96" rx="6" ry="9" fill="#E2AE8A" />
  <!-- Jhumkas -->
  <circle cx="66" cy="104" r="2.5" fill="#FBBF24" />
  <path d="M63 107 L69 107 L66 114 Z" fill="#FBBF24" />
  <circle cx="134" cy="104" r="2.5" fill="#FBBF24" />
  <path d="M131 107 L137 107 L134 114 Z" fill="#FBBF24" />

  <!-- Hair (Front / Bun) -->
  <path d="M60 85 C62 55, 80 40, 100 40 C120 40, 138 55, 140 85 C132 62, 115 54, 100 54 C85 54, 68 62, 60 85 Z" fill="url(#hairGrad)" />
  <!-- Gajra / Flower in hair -->
  <circle cx="64" cy="58" r="4.5" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5" />
  <circle cx="72" cy="50" r="4.5" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5" />
  <circle cx="82" cy="45" r="4.5" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5" />

  <!-- Eyes -->
  <ellipse cx="87" cy="91" rx="4.5" ry="3.5" fill="#1C1917" />
  <ellipse cx="113" cy="91" rx="4.5" ry="3.5" fill="#1C1917" />
  <!-- Kajal Wing -->
  <path d="M91.5 91 C93 90, 95 89, 96 89" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round" />
  <path d="M117.5 91 C119 90, 121 89, 122 89" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="88.5" cy="89.5" r="1.2" fill="#FFFFFF" />
  <circle cx="114.5" cy="89.5" r="1.2" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M79 83 C84 79, 92 80, 95 83" stroke="#262626" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M121 83 C116 79, 108 80, 105 83" stroke="#262626" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Bindi -->
  <circle cx="100" cy="78" r="3" fill="#DC2626" />
  <circle cx="100" cy="78" r="1" fill="#FBBF24" />

  <!-- Nose & Nath / Stud -->
  <path d="M100 90 C100 97, 97 100, 100 102 C102 102, 103 100, 103 98" stroke="#C27848" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <circle cx="96" cy="100" r="1.5" fill="#FBBF24" />

  <!-- Smile / Lips -->
  <path d="M93 115 C96 120, 104 120, 107 115 C104 117, 96 117, 93 115 Z" fill="#E11D48" />
</svg>
