  <!-- Turban / Pagri -->
  <path d="M60 76 C55 45, 80 25, 100 25 C125 25, 148 45, 140 76 C130 55, 115 50, 100 50 C85 50, 70 55, 60 76 Z" fill="url(#turbanGrad)" />
  <path d="M62 65 C78 50, 122 50, 138 65 C132 50, 118 42, 100 42 C82 42, 68 50, 62 65 Z" fill="#EA580C" />
  <path d="M96 25 C98 18, 102 18, 104 25 Z" fill="#FBBF24" />
