  <!-- Ears -->
  <ellipse cx="64" cy="94" rx="7" ry="10" fill="#D19263" />
  <ellipse cx="136" cy="94" rx="7" ry="10" fill="#D19263" />
  <circle cx="64" cy="98" r="2" fill="#D97706" />
  <circle cx="136" cy="98" r="2" fill="#D97706" />

  <!-- Eyes -->
  <ellipse cx="86" cy="88" rx="4.5" ry="3.5" fill="#1C1917" />
  <ellipse cx="114" cy="88" rx="4.5" ry="3.5" fill="#1C1917" />
  <circle cx="87.5" cy="86.5" r="1.2" fill="#FFFFFF" />
  <circle cx="115.5" cy="86.5" r="1.2" fill="#FFFFFF" />

