  <path d="M40 185 C40 145, 70 135, 100 135 C130 135, 160 145, 160 185 Z" fill="url(#kurtaGrad)" />
  <path d="M90 135 L100 160 L110 135 Z" fill="#CCFBF1" opacity="0.8" />
  <circle cx="100" cy="168" r="2.5" fill="#D97706" />
  <circle cx="100" cy="178" r="2.5" fill="#D97706" />

  <!-- Neck -->
  <rect x="88" y="112" width="24" height="28" rx="6" fill="url(#skinGradMale)" />

  <!-- Head / Face -->
