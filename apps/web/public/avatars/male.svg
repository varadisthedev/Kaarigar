  <path d="M78 80 C83 77, 91 78, 93 81" stroke="#451A03" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M122 80 C117 77, 109 78, 107 81" stroke="#451A03" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Tilak -->
  <path d="M98 72 L100 66 L102 72 Z" fill="#DC2626" />
  <circle cx="100" cy="75" r="2" fill="#D97706" />

  <!-- Nose -->
  <path d="M100 88 C100 95, 96 98, 100 101 C102 101, 104 99, 104 97" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Mustache -->
  <path d="M82 107 C90 103, 98 108, 100 110 C102 108, 110 103, 118 107 C113 111, 103 112, 100 111 C97 112, 87 111, 82 107 Z" fill="#292524" />

  <!-- Smile / Lips -->
